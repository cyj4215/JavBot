[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "javbot"
version = "1.0.0"
description = "Telegram JAV Actress Information Bot"
requires-python = ">=3.11"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Ignore missing imports for third-party libraries without stubs
ignore_missing_imports = true

# Per-module configuration
[[tool.mypy.overrides]]
module = [
    "jvav.*",
    "wikipediaapi.*",
    "opencc.*",
    "pypinyin.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "ARG", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "ARG001", "ARG005"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["unit: Pure unit tests (no network, no DB)", "integration: Tests using real DB", "service: Service-layer tests with mocked APIs"]
